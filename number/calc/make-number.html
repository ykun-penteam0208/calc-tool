  <script>
    // Lucide アイコン初期化
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }

    const $ = (id) => document.getElementById(id);

    // サンプルプリセット一覧
    const presets = [
      { target: '1015', digits: '1,2,3,4,5,6,7,8,9,0' },
      { target: '1010', digits: '1,2,3,4,5,6,7,8,9,0' },
      { target: '1005', digits: '1,2,3,4,5,6,7,8,9,0' },
      { target: '2026', digits: '1,2,3,4,5,6,7,8,9,0' },
      { target: '1/6',  digits: '1,2,3,4,5,6,7,8,9,0' },
      { target: '0.5',  digits: '1,2,3,4,5,6,7,8,9,0' },
    ];
    let presetIdx = 0;
    let currentRawLatex = '';

    let abortFlag = false;
    let isRunning = false;

    // KaTeX 描画ヘルパー
    function renderTex(el, texStr, displayMode = true) {
      if (!el) return;
      if (window.katex && typeof window.katex.render === 'function') {
        try {
          window.katex.render(texStr, el, {
            displayMode,
            throwOnError: false,
          });
          return;
        } catch (_) {}
      }
      el.textContent = texStr;
    }

    // メイン数式表示更新
    function setMainFormula(texStr, evalVal) {
      currentRawLatex = texStr;
      renderTex($('latexOutput'), texStr, true);
      $('rawLatexSource').textContent = `LaTeX: ${texStr}`;
      if (typeof evalVal === 'number' && Number.isFinite(evalVal)) {
        $('evalInfo').textContent = `計算結果: ${Number(evalVal.toFixed(10))}`;
      }
    }

    // 有効なチェックボックス数の表示を更新
    function updateRuleBadge() {
      const boxes = Array.from(document.querySelectorAll('.rule-checkbox'));
      const activeCount = boxes.filter((el) => el.checked).length;
      $('activeRulesBadge').textContent = `${activeCount}/${boxes.length} オンだじゃ！`;
    }

    document.querySelectorAll('.rule-checkbox').forEach((box) => {
      box.addEventListener('change', updateRuleBadge);
    });
    updateRuleBadge();

    // サンプル読込ボタン
    $('presetBtn').addEventListener('click', () => {
      const preset = presets[presetIdx % presets.length];
      $('targetInput').value = preset.target;
      $('digitsInput').value = preset.digits;
      presetIdx += 1;
    });

    // クリップボードコピー（execCommand フォールバック対応）
    $('copyBtn').addEventListener('click', async () => {
      if (!currentRawLatex) return;
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(currentRawLatex);
          copied = true;
        }
      } catch (_) {
        copied = false;
      }
      if (!copied) {
        try {
          const ta = document.createElement('textarea');
          ta.value = currentRawLatex;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copied = true;
        } catch (_) {}
      }
      if (copied) {
        $('copyLabel').textContent = 'バッチリパクったじゃ！(≧∇≦)b';
        setTimeout(() => {
          $('copyLabel').textContent = 'LaTeXパクる';
        }, 1400);
      }
    });

    // 停止ボタン
    $('stopBtn').addEventListener('click', () => {
      abortFlag = true;
    });

    // 目標値のパース（整数・小数・分数 a/b・pi/e・簡易演算式）
    function parseTargetValue(raw) {
      const s = raw
        .trim()
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\bpi\b/gi, 'Math.PI')
        .replace(/\be\b/g, 'Math.E')
        .replace(/\s+/g, '');
      if (!s) return null;
      const fracMatch = s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);
      if (fracMatch) {
        const num = parseFloat(fracMatch[1]);
        const den = parseFloat(fracMatch[2]);
        if (!Number.isFinite(num) || !Number.isFinite(den) || den === 0) return null;
        return num / den;
      }
      try {
        const sanitized = s.replace(/Math\.(PI|E)/g, '1');
        if (!/^[0-9+\-*/().^\s]+$/.test(sanitized)) return null;
        const jsExpr = s.replace(/\^/g, '**');
        const val = Function(`"use strict"; return (${jsExpr});`)();
        return typeof val === 'number' && Number.isFinite(val) ? val : null;
      } catch (_) {
        return null;
      }
    }

    // 使用数字リストのパース
    function parseDigits(raw) {
      const cleaned = raw.trim();
      if (!cleaned) return [];
      if (cleaned.includes(',')) {
        return cleaned.split(',').map((x) => x.trim()).filter((x) => x.length > 0);
      }
      return cleaned.replace(/\s+/g, '').split('');
    }

    // 階乗（オーバーフロー防止のため 0..7 に制限）
    function factorial(n) {
      if (!Number.isInteger(n) || n < 0 || n > 7) return null;
      let res = 1;
      for (let i = 2; i <= n; i += 1) {
        res *= i;
      }
      return res;
    }

    // 順列生成（重複要素を考慮）
    function getPermutations(arr, maxCount = 720) {
      const results = [];
      const used = new Array(arr.length).fill(false);
      const path = [];
      function dfs() {
        if (results.length >= maxCount) return;
        if (path.length === arr.length) {
          results.push([...path]);
          return;
        }
        for (let i = 0; i < arr.length; i += 1) {
          if (used[i]) continue;
          if (i > 0 && arr[i] === arr[i - 1] && !used[i - 1]) continue;
          used[i] = true;
          path.push(arr[i]);
          dfs();
          path.pop();
          used[i] = false;
        }
      }
      dfs();
      return results;
    }

    // 部分集合生成（全数字使用OFF時用）
    function getSubsets(arr) {
      const out = [];
      const total = 1 << arr.length;
      for (let mask = 1; mask < total; mask += 1) {
        const sub = [];
        for (let i = 0; i < arr.length; i += 1) {
          if ((mask >> i) & 1) sub.push(arr[i]);
        }
        out.push(sub);
      }
      out.sort((a, b) => b.length - a.length);
      return out;
    }

    // 桁の連結分割
    function getConcatSplits(seq, allowConcat) {
      if (!allowConcat) {
        for (const token of seq) {
          if (!/^[+-]?\d+(\.\d+)?$/.test(token)) return [];
        }
        return [seq.map((t) => ({ val: Number(t), tex: t, prec: 4 }))];
      }
      const splits = [];
      function dfs(idx, acc) {
        if (idx === seq.length) {
          splits.push([...acc]);
          return;
        }
        for (let end = idx + 1; end <= seq.length; end += 1) {
          const piece = seq.slice(idx, end).join('');
          if (/^\d+$/.test(piece)) {
            if (piece.length > 1 && piece.startsWith('0')) continue;
            acc.push({ val: Number(piece), tex: piece, prec: 4 });
            dfs(end, acc);
            acc.pop();
          } else if (end === idx + 1) {
            const num = Number(piece);
            if (Number.isFinite(num)) {
              acc.push({ val: num, tex: piece, prec: 4 });
              dfs(end, acc);
              acc.pop();
            }
          }
        }
      }
      dfs(0, []);
      return splits;
    }

    // 単項演算バリエーション生成（階乗 !、ルート \sqrt{}、三角比 sin/cos/tan、逆三角比 arcsin/arccos/arctan）
    function getUnaryVariants(parts, optsRule) {
      const { allowFactorial, allowTrig, allowInvTrig, allowSqrt } = optsRule;

      const choiceLists = parts.map((p) => {
        const opts = [{ val: p.val, tex: p.tex, prec: 4 }];

        // 階乗 !
        if (allowFactorial && Number.isInteger(p.val) && p.val >= 1 && p.val <= 6) {
          const f = factorial(p.val);
          if (f !== null) {
            const baseTex = p.prec < 4 ? `(${p.tex})` : p.tex;
            opts.push({ val: f, tex: `${baseTex}!`, prec: 4 });
          }
        }

        // 平方根 \sqrt{}
        if (allowSqrt && p.val >= 0 && p.val <= 10000) {
          const r = Math.sqrt(p.val);
          if (Number.isFinite(r)) {
            opts.push({ val: r, tex: `\\sqrt{${p.tex}}`, prec: 4 });
          }
        }

        // 三角比 sin / cos / tan（ラジアン扱い、精度誤差に注意しつつ探索）
        if (allowTrig && Math.abs(p.val) <= 64) {
          const s = Math.sin(p.val);
          const c = Math.cos(p.val);
          const t = Math.tan(p.val);
          if (Number.isFinite(s) && Math.abs(s) > 1e-12) {
            opts.push({ val: s, tex: `\\sin(${p.tex})`, prec: 4 });
          }
          if (Number.isFinite(c) && Math.abs(c) > 1e-12) {
            opts.push({ val: c, tex: `\\cos(${p.tex})`, prec: 4 });
          }
          if (Number.isFinite(t) && Math.abs(t) < 1e6 && Math.abs(c) > 1e-6) {
            opts.push({ val: t, tex: `\\tan(${p.tex})`, prec: 4 });
          }
        }

        // 逆三角比 arcsin / arccos / arctan
        if (allowInvTrig && Math.abs(p.val) <= 1) {
          const as = Math.asin(p.val);
          const ac = Math.acos(p.val);
          if (Number.isFinite(as)) {
            opts.push({ val: as, tex: `\\arcsin(${p.tex})`, prec: 4 });
          }
          if (Number.isFinite(ac)) {
            opts.push({ val: ac, tex: `\\arccos(${p.tex})`, prec: 4 });
          }
        }
        if (allowInvTrig && Math.abs(p.val) <= 10000) {
          const at = Math.atan(p.val);
          if (Number.isFinite(at)) {
            opts.push({ val: at, tex: `\\arctan(${p.tex})`, prec: 4 });
          }
        }

        return opts.slice(0, 6);
      });

      const combos = [];
      function dfs(i, cur) {
        if (combos.length >= 256) return;
        if (i === choiceLists.length) {
          combos.push([...cur]);
          return;
        }
        for (const opt of choiceLists[i]) {
          cur.push(opt);
          dfs(i + 1, cur);
          cur.pop();
        }
      }
      dfs(0, []);
      return combos;
    }

    // 式木構築・評価（LaTeX形式・優先順位とカッコ制御）
    function buildExpressions(nodes, allowParens, allowPower, maxResults = 10) {
      const memo = new Map();

      function solve(l, r) {
        const key = `${l},${r}`;
        if (memo.has(key)) return memo.get(key);
        if (l === r) {
          const base = [{ val: nodes[l].val, tex: nodes[l].tex, prec: nodes[l].prec || 4 }];
          memo.set(key, base);
          return base;
        }
        const out = [];
        for (let mid = l; mid < r; mid += 1) {
          const leftList = solve(l, mid);
          const rightList = solve(mid + 1, r);
          for (const a of leftList) {
            for (const b of rightList) {
              if (!Number.isFinite(a.val) || !Number.isFinite(b.val)) continue;

              const fmtSide = (side, opPrec, isRight, isPowBase = false) => {
                const needsParen = isPowBase
                  ? side.prec < 4
                  : side.prec < opPrec || (isRight && side.prec === opPrec);
                if (!needsParen) return side.tex;
                return allowParens ? `(${side.tex})` : null;
              };

              // 加算 +
              {
                const eL = fmtSide(a, 1, false);
                const eR = fmtSide(b, 1, true);
                if (eL && eR) {
                  out.push({ val: a.val + b.val, tex: `${eL} + ${eR}`, prec: 1 });
                }
              }
              // 減算 -
              {
                const eL = fmtSide(a, 1, false);
                const eR = fmtSide(b, 1, true);
                if (eL && eR) {
                  out.push({ val: a.val - b.val, tex: `${eL} - ${eR}`, prec: 1 });
                }
              }
              // 乗算 \times
              {
                const eL = fmtSide(a, 2, false);
                const eR = fmtSide(b, 2, true);
                if (eL && eR) {
                  out.push({ val: a.val * b.val, tex: `${eL} \\times ${eR}`, prec: 2 });
                }
              }
              // 除算 \div
              if (Math.abs(b.val) > 1e-12) {
                const eL = fmtSide(a, 2, false);
                const eR = fmtSide(b, 2, true);
                if (eL && eR) {
                  out.push({ val: a.val / b.val, tex: `${eL} \\div ${eR}`, prec: 2 });
                }
              }
              // 累乗 ^
              if (allowPower && Math.abs(a.val) <= 25 && b.val >= -6 && b.val <= 6) {
                const pw = Math.pow(a.val, b.val);
                if (typeof pw === 'number' && Number.isFinite(pw) && Math.abs(pw) < 1e9) {
                  const eL = fmtSide(a, 3, false, true);
                  const eR = fmtSide(b, 3, true, false);
                  if (eL && eR) {
                    out.push({ val: pw, tex: `${eL}^{${eR}}`, prec: 3 });
                  }
                }
              }

              if (out.length >= 420) break;
            }
            if (out.length >= 420) break;
          }
        }
        memo.set(key, out);
        return out;
      }

      return solve(0, nodes.length - 1).slice(0, maxResults * 40);
    }

    // 候補アイテムDOM生成（LaTeX描画）
    function renderCandidate(item) {
      const div = document.createElement('div');
      div.className = 'flex items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-900/75 px-3.5 py-2.5 hover:border-cyan-500/40 transition';

      const leftWrap = document.createElement('div');
      leftWrap.className = 'min-w-0 flex-1 space-y-1';

      const texBox = document.createElement('div');
      texBox.className = 'text-slate-100 overflow-x-auto';
      renderTex(texBox, item.tex, false);

      const metaBox = document.createElement('div');
      metaBox.className = 'font-mono text-[11px] text-slate-500 truncate';
      metaBox.textContent = `= ${Number(item.val.toFixed(10))} | ${item.tex}`;

      leftWrap.appendChild(texBox);
      leftWrap.appendChild(metaBox);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shrink-0 text-[11px] font-mono px-2.5 py-1 rounded-md border border-slate-700 text-cyan-400 hover:bg-cyan-500/10 transition cursor-pointer';
      btn.textContent = 'これにする！';
      btn.addEventListener('click', () => {
        setMainFormula(item.tex, item.val);
      });

      div.appendChild(leftWrap);
      div.appendChild(btn);
      return div;
    }

    // 探索メインループ
    async function runGenerator() {
      if (isRunning) return;

      const targetVal = parseTargetValue($('targetInput').value);
      const rawDigits = parseDigits($('digitsInput').value);

      if (targetVal === null) {
        $('statusBadge').textContent = '入力ミスだじゃ〜！(；´Д｀)';
        $('latexOutput').innerHTML = '<span class="font-mono text-sm text-rose-400">目標の数字ばちゃんと入れてみれじゃ〜！</span>';
        return;
      }
      if (rawDigits.length === 0) {
        $('statusBadge').textContent = '数字の個数エラーだべさ';
        $('latexOutput').innerHTML = '<span class="font-mono text-sm text-rose-400">数字は1個から入れてくれじゃ〜！</span>';
        return;
      }

      const useAll = $('ruleUseAll').checked;
      const allowOrderChange = $('ruleAllowOrderChange').checked;
      const allowConcat = $('ruleAllowConcat').checked;
      const allowParens = $('ruleAllowParens').checked;
      const allowPower = $('ruleAllowPower').checked;
      const allowFactorial = $('ruleAllowFactorial').checked;
      const allowTrig = $('ruleAllowTrig').checked;
      const allowInvTrig = $('ruleAllowInvTrig').checked;
      const allowSqrt = $('ruleAllowSqrt').checked;

      isRunning = true;
      abortFlag = false;
      $('generateBtn').disabled = true;
      $('stopBtn').disabled = false;
      $('statusBadge').textContent = '俺が探してる最中だじゃ〜！(ง •̀_•́)ง';
      $('candidatesList').innerHTML = '';
      $('candidateCount').textContent = '0 個';
      $('evalInfo').textContent = `狙いの値: ${Number(targetVal.toFixed(10))}`;

      const t0 = performance.now();
      let tries = 0;
      const foundExprs = new Set();
      const foundList = [];

      const basePool = allowOrderChange ? [...rawDigits].sort() : [...rawDigits];
      const subsets = useAll ? [basePool] : getSubsets(basePool);

      const sequences = [];
      for (const sub of subsets) {
        if (allowOrderChange) {
          const perms = getPermutations(sub, useAll ? 720 : 240);
          for (const p of perms) sequences.push(p);
        } else {
          sequences.push(sub);
        }
        if (sequences.length > 1200) break;
      }

      const unaryRuleOpts = { allowFactorial, allowTrig, allowInvTrig, allowSqrt };

      for (let i = 0; i < sequences.length; i += 1) {
        if (abortFlag || foundList.length >= 10) break;
        const seq = sequences[i];
        const splits = getConcatSplits(seq, allowConcat);

        for (const parts of splits) {
          if (abortFlag || foundList.length >= 10) break;
          const variants = getUnaryVariants(parts, unaryRuleOpts);

          for (const nodes of variants) {
            if (abortFlag || foundList.length >= 10) break;
            const candidates = buildExpressions(nodes, allowParens, allowPower, 10);
            for (const c of candidates) {
              tries += 1;
              if (Math.abs(c.val - targetVal) < 1e-8 && !foundExprs.has(c.tex)) {
                foundExprs.add(c.tex);
                foundList.push(c);
                if (foundList.length === 1) {
                  setMainFormula(c.tex, c.val);
                }
                $('candidatesList').appendChild(renderCandidate(c));
                $('candidateCount').textContent = `${foundList.length} 個`;
              }
            }
          }
        }

        if (i % 12 === 0) {
          const elapsed = Math.round(performance.now() - t0);
          $('statsInfo').textContent = `探した回数: ${tries.toLocaleString()} / 時間: ${elapsed}ms`;
          await new Promise((r) => setTimeout(r, 0));
        }
      }

      const totalElapsed = Math.round(performance.now() - t0);
      $('statsInfo').textContent = `探した回数: ${tries.toLocaleString()} / 時間: ${totalElapsed}ms`;

      if (foundList.length > 0) {
        $('statusBadge').textContent = '見つけたじゃ〜！(∩´∀`∩)🎉';
      } else if (abortFlag) {
        $('statusBadge').textContent = 'ストップしたべさ';
        $('latexOutput').innerHTML = '<span class="font-mono text-sm text-amber-300">途中でストップしたじゃ〜！(｀・ω・´)ゞ</span>';
      } else {
        $('statusBadge').textContent = '見つがんねかったじゃ…(；´Д｀)';
        $('latexOutput').innerHTML = '<span class="font-mono text-sm text-slate-400">この条件だと合う式が見つがんねかったべさ〜！チェックボックス変えてみれじゃ！</span>';
      }

      isRunning = false;
      $('generateBtn').disabled = false;
      $('stopBtn').disabled = true;
    }

    $('generateBtn').addEventListener('click', runGenerator);
  </script>
