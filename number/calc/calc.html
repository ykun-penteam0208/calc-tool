<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部入り多機能計算機 | Ykun Tool Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    .bg-grid-pattern {
      background-image:
        linear-gradient(to right, rgba(245, 158, 11, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(245, 158, 11, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .calc-btn {
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .calc-btn:active {
      transform: scale(0.94);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.6);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.8);
    }
  </style>
</head>
<body class="bg-slate-950 bg-grid-pattern text-slate-100 min-h-screen flex flex-col justify-between antialiased p-4 sm:p-6 relative overflow-x-hidden">

  <!-- 背景のネオンオーラ -->
  <div class="fixed top-[-10%] left-1/3 w-[500px] h-[300px] bg-amber-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-1/4 w-[400px] h-[300px] bg-purple-600/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- メモリー履歴ドロワー用オーバーレイ -->
  <div id="drawer-backdrop" onclick="closeMemoryDrawer()" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-200"></div>

  <!-- 右スライド式 メモリー履歴ドロワー -->
  <aside id="memory-drawer" class="fixed top-0 right-0 h-full w-full max-w-sm bg-slate-900 border-l border-slate-800 shadow-2xl z-50 translate-x-full transition-transform duration-300 flex flex-col justify-between p-5">
    <div class="flex flex-col h-full overflow-hidden">
      <!-- ドロワーヘッダー -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
            <i data-lucide="bookmark" class="w-4 h-4"></i>
          </div>
          <div>
            <h2 class="text-sm font-bold text-white">メモリー履歴</h2>
            <p class="text-[10px] text-slate-400 font-mono">LocalStorage 保存中 💾</p>
          </div>
        </div>
        <button onclick="closeMemoryDrawer()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition" aria-label="閉じる">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 現在の値・結果をメモリー保存するボタン -->
      <button onclick="saveCurrentToMemory()" class="w-full mb-4 py-2.5 px-4 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-bold flex items-center justify-center gap-2 transition shadow-md">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>今の値・プレビューをメモリー保存</span>
      </button>

      <!-- メモリー履歴リスト -->
      <div id="memory-history-list" class="flex-grow overflow-y-auto space-y-2.5 pr-1">
        <!-- JSで描画 -->
      </div>
    </div>

    <!-- ドロワー下部アクション -->
    <div class="pt-4 border-t border-slate-800 flex items-center justify-between gap-2">
      <button onclick="clearMemoryHistory()" class="w-full py-2 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-300 text-xs font-bold flex items-center justify-center gap-1.5 transition">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span>メモリー履歴を全消去</span>
      </button>
    </div>
  </aside>

  <div class="max-w-2xl w-full mx-auto relative z-10 flex-grow flex flex-col justify-center">

    <!-- トップナビゲーション（右上にメニューボタン配置！） -->
    <div class="flex items-center justify-between mb-6">
      <a href="../../index.html" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900/90 border border-slate-800 hover:border-amber-500/50 text-xs font-semibold text-slate-300 hover:text-amber-300 transition shadow-md">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>ポータルへ戻る</span>
      </a>

      <div class="flex items-center gap-2">
        <span class="hidden sm:inline-flex px-2.5 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[11px] font-bold">
          PRO SCIENTIFIC CALC 🧮✨
        </span>
        <!-- 右上メニューボタン -->
        <button onclick="openMemoryDrawer()" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 hover:border-amber-500/50 text-xs font-bold text-white transition shadow-md">
          <i data-lucide="menu" class="w-4 h-4 text-amber-400"></i>
          <span>メモリー履歴</span>
          <span id="memory-badge-count" class="px-1.5 py-0.5 text-[10px] font-mono rounded-md bg-amber-500/20 text-amber-300">0</span>
        </button>
      </div>
    </div>

    <!-- 計算機本体（単一パネルでスッキリ配置） -->
    <div class="bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-2xl flex flex-col justify-between">

      <!-- ステータス＆モード切り替えバー -->
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
          <button id="btn-deg" class="px-3 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition">DEG (度)</button>
          <button id="btn-rad" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">RAD (弧度)</button>
        </div>

        <div class="flex items-center gap-2 text-xs font-mono">
          <button onclick="insertAns()" class="px-2.5 py-1 rounded-lg bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-500/30 text-indigo-300 font-bold transition">Ans</button>
          <span class="text-slate-500 text-[11px] hidden sm:inline">キーボード入力OK ⌨️</span>
        </div>
      </div>

      <!-- ディスプレイ画面 -->
      <div class="bg-slate-950 border border-slate-800/90 rounded-2xl p-4 sm:p-5 mb-4 shadow-inner flex flex-col justify-between min-h-[135px] relative overflow-hidden">
        <div id="prev-expression" class="text-right text-xs font-mono text-slate-500 h-5 overflow-x-auto whitespace-nowrap"></div>
        <div id="expression-display" class="text-right text-2xl sm:text-3xl font-mono font-bold text-white tracking-wider overflow-x-auto whitespace-nowrap py-1">
          0
        </div>
        <div class="flex items-center justify-between border-t border-slate-900 pt-2 mt-1">
          <span class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Preview</span>
          <div id="preview-display" class="text-right text-sm sm:text-base font-mono font-semibold text-amber-400/90 overflow-x-auto whitespace-nowrap">
            = 0
          </div>
        </div>
      </div>

      <!-- キーパッド（5列グリッド） -->
      <div class="grid grid-cols-5 gap-2 sm:gap-2.5 font-mono">

        <!-- 1行目：三角関数・バックスペース・AC -->
        <button onclick="appendFunc('sin(')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-cyan-300 border border-slate-700/40">sin</button>
        <button onclick="appendFunc('cos(')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-cyan-300 border border-slate-700/40">cos</button>
        <button onclick="appendFunc('tan(')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-cyan-300 border border-slate-700/40">tan</button>
        <button onclick="backspace()" class="calc-btn py-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 flex items-center justify-center" title="1文字削除">
          <i data-lucide="delete" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
        <button onclick="clearAll()" class="calc-btn py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs sm:text-sm font-extrabold text-white shadow-md shadow-rose-600/20">AC</button>

        <!-- 2行目：対数・括弧・割り算 -->
        <button onclick="appendFunc('log(')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-cyan-300 border border-slate-700/40">log</button>
        <button onclick="appendFunc('ln(')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-cyan-300 border border-slate-700/40">ln</button>
        <button onclick="appendToken('(')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-slate-300 border border-slate-700/40">(</button>
        <button onclick="appendToken(')')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-slate-300 border border-slate-700/40">)</button>
        <button onclick="appendOperator('÷')" class="calc-btn py-3 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-base sm:text-lg font-bold text-amber-300 border border-amber-500/30">÷</button>

        <!-- 3行目：ルート・7・8・9・掛け算 -->
        <button onclick="appendFunc('√(')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-emerald-300 border border-slate-700/40">√</button>
        <button onclick="appendNumber('7')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">7</button>
        <button onclick="appendNumber('8')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">8</button>
        <button onclick="appendNumber('9')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">9</button>
        <button onclick="appendOperator('×')" class="calc-btn py-3 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-base sm:text-lg font-bold text-amber-300 border border-amber-500/30">×</button>

        <!-- 4行目：累乗・4・5・6・引き算 -->
        <button onclick="appendOperator('^')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-emerald-300 border border-slate-700/40">xʸ</button>
        <button onclick="appendNumber('4')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">4</button>
        <button onclick="appendNumber('5')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">5</button>
        <button onclick="appendNumber('6')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">6</button>
        <button onclick="appendOperator('-')" class="calc-btn py-3 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-base sm:text-lg font-bold text-amber-300 border border-amber-500/30">−</button>

        <!-- 5行目：π・1・2・3・足し算 -->
        <button onclick="appendConstant('π')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-purple-300 border border-slate-700/40">π</button>
        <button onclick="appendNumber('1')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">1</button>
        <button onclick="appendNumber('2')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">2</button>
        <button onclick="appendNumber('3')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">3</button>
        <button onclick="appendOperator('+')" class="calc-btn py-3 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-base sm:text-lg font-bold text-amber-300 border border-amber-500/30">＋</button>

        <!-- 6行目：e・0・小数点・階乗・イコール -->
        <button onclick="appendConstant('e')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-purple-300 border border-slate-700/40">e</button>
        <button onclick="appendNumber('0')" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">0</button>
        <button onclick="appendDot()" class="calc-btn py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-base sm:text-lg font-bold text-white border border-slate-700/60">.</button>
        <button onclick="appendPostfix('!')" class="calc-btn py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-xs sm:text-sm font-semibold text-emerald-300 border border-slate-700/40">n!</button>
        <button onclick="calculateResult()" class="calc-btn py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-lg sm:text-xl font-extrabold text-slate-950 shadow-lg shadow-amber-500/25">＝</button>

      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      MEMORY_HISTORY: 'ykun_calc_memory_history_v1',
      LAST_ANSWER: 'ykun_calc_last_answer_v1',
      IS_DEGREE: 'ykun_calc_is_degree_v1'
    };

    function safeStorageGet(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        if (raw === null) return fallback;
        return JSON.parse(raw);
      } catch (err) {
        return fallback;
      }
    }

    function safeStorageSet(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (err) {
        // 保存制限・プライベートモード時は安全にスキップ
      }
    }

    let expression = '';
    let lastAnswer = Number(safeStorageGet(STORAGE_KEYS.LAST_ANSWER, 0)) || 0;
    let isDegree = Boolean(safeStorageGet(STORAGE_KEYS.IS_DEGREE, true));
    let memoryHistory = Array.isArray(safeStorageGet(STORAGE_KEYS.MEMORY_HISTORY, []))
      ? safeStorageGet(STORAGE_KEYS.MEMORY_HISTORY, [])
      : [];
    let justCalculated = false;

    const exprDisplay = document.getElementById('expression-display');
    const prevExprDisplay = document.getElementById('prev-expression');
    const previewDisplay = document.getElementById('preview-display');
    const memoryHistoryList = document.getElementById('memory-history-list');
    const memoryBadgeCount = document.getElementById('memory-badge-count');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const memoryDrawer = document.getElementById('memory-drawer');
    const btnDeg = document.getElementById('btn-deg');
    const btnRad = document.getElementById('btn-rad');

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
      applyAngleModeUI();
      renderMemoryHistory();
      updateDisplay();
    });

    function applyAngleModeUI() {
      if (isDegree) {
        btnDeg.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition';
        btnRad.className = 'px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition';
      } else {
        btnRad.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition';
        btnDeg.className = 'px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition';
      }
    }

    btnDeg.addEventListener('click', () => {
      isDegree = true;
      safeStorageSet(STORAGE_KEYS.IS_DEGREE, isDegree);
      applyAngleModeUI();
      updateDisplay();
    });

    btnRad.addEventListener('click', () => {
      isDegree = false;
      safeStorageSet(STORAGE_KEYS.IS_DEGREE, isDegree);
      applyAngleModeUI();
      updateDisplay();
    });

    function openMemoryDrawer() {
      drawerBackdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        drawerBackdrop.classList.remove('opacity-0');
        memoryDrawer.classList.remove('translate-x-full');
      });
    }

    function closeMemoryDrawer() {
      drawerBackdrop.classList.add('opacity-0');
      memoryDrawer.classList.add('translate-x-full');
      setTimeout(() => {
        drawerBackdrop.classList.add('hidden');
      }, 250);
    }

    function factorial(n) {
      if (n < 0 || !Number.isInteger(n)) throw new Error('Invalid factorial');
      if (n > 170) return Infinity;
      let res = 1;
      for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    function evaluateExpression(rawExpr) {
      if (!rawExpr || rawExpr.trim() === '') return 0;

      let expr = rawExpr;

      const openParens = (expr.match(/\(/g) || []).length;
      const closeParens = (expr.match(/\)/g) || []).length;
      if (openParens > closeParens) {
        expr += ')'.repeat(openParens - closeParens);
      }

      expr = expr
        .replace(/(\d)(π|e|Ans|\(|sin|cos|tan|log|ln|√)/g, '$1*$2')
        .replace(/(π|e|Ans|\)|!)(\d|\(|π|e|Ans|sin|cos|tan|log|ln|√)/g, '$1*$2');

      while (expr.includes('!')) {
        const prev = expr;
        expr = expr.replace(/(\([^()]*\)|\d+(?:\.\d+)?)!/g, 'factorial($1)');
        if (expr === prev) break;
      }

      expr = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\^/g, '**')
        .replace(/π/g, 'Math.PI')
        .replace(/\be\b/g, 'Math.E')
        .replace(/Ans/g, `(${lastAnswer})`)
        .replace(/√\(/g, 'Math.sqrt(')
        .replace(/log\(/g, 'Math.log10(')
        .replace(/ln\(/g, 'Math.log(');

      const trigSin = (x) => isDegree ? Math.sin((x * Math.PI) / 180) : Math.sin(x);
      const trigCos = (x) => isDegree ? Math.cos((x * Math.PI) / 180) : Math.cos(x);
      const trigTan = (x) => {
        if (isDegree && Math.abs(x % 180) === 90) throw new Error('Undefined tan');
        return isDegree ? Math.tan((x * Math.PI) / 180) : Math.tan(x);
      };

      expr = expr
        .replace(/sin\(/g, 'trigSin(')
        .replace(/cos\(/g, 'trigCos(')
        .replace(/tan\(/g, 'trigTan(');

      const fn = new Function('trigSin', 'trigCos', 'trigTan', 'factorial', `return (${expr});`);
      const result = fn(trigSin, trigCos, trigTan, factorial);

      if (typeof result !== 'number' || Number.isNaN(result)) {
        throw new Error('NaN');
      }
      if (!Number.isFinite(result)) {
        return result > 0 ? '∞' : '-∞';
      }

      return Math.round(result * 1e12) / 1e12;
    }

    function updateDisplay() {
      exprDisplay.textContent = expression || '0';
      exprDisplay.scrollLeft = exprDisplay.scrollWidth;

      try {
        if (!expression) {
          previewDisplay.textContent = '= 0';
          previewDisplay.className = 'text-right text-sm sm:text-base font-mono font-semibold text-amber-400/90 overflow-x-auto whitespace-nowrap';
          return;
        }
        const val = evaluateExpression(expression);
        previewDisplay.textContent = `= ${formatNumber(val)}`;
        previewDisplay.className = 'text-right text-sm sm:text-base font-mono font-semibold text-amber-400/90 overflow-x-auto whitespace-nowrap';
      } catch (e) {
        previewDisplay.textContent = '...';
        previewDisplay.className = 'text-right text-sm sm:text-base font-mono font-semibold text-slate-600 overflow-x-auto whitespace-nowrap';
      }
    }

    function formatNumber(val) {
      if (typeof val !== 'number') return String(val);
      return val.toLocaleString('en-US', { maximumFractionDigits: 10 });
    }

    function appendNumber(num) {
      if (justCalculated) {
        expression = '';
        justCalculated = false;
      }
      if (expression === '0') expression = '';
      expression += num;
      updateDisplay();
    }

    function appendDot() {
      if (justCalculated) {
        expression = '0';
        justCalculated = false;
      }
      if (expression === '') expression = '0';
      const parts = expression.split(/[+\-×÷^()]/);
      const lastPart = parts[parts.length - 1];
      if (!lastPart.includes('.')) {
        expression += (lastPart === '' ? '0.' : '.');
      }
      updateDisplay();
    }

    function appendOperator(op) {
      justCalculated = false;
      if (expression === '' && op !== '-') {
        expression = '0' + op;
      } else if (/[+\-×÷^]$/.test(expression)) {
        expression = expression.slice(0, -1) + op;
      } else {
        expression += op;
      }
      updateDisplay();
    }

    function appendFunc(funcName) {
      if (justCalculated) {
        expression = '';
        justCalculated = false;
      }
      if (expression === '0') expression = '';
      expression += funcName;
      updateDisplay();
    }

    function appendConstant(c) {
      if (justCalculated) {
        expression = '';
        justCalculated = false;
      }
      if (expression === '0') expression = '';
      expression += c;
      updateDisplay();
    }

    function appendToken(token) {
      if (justCalculated) {
        expression = '';
        justCalculated = false;
      }
      if (expression === '0' && token === '(') expression = '';
      expression += token;
      updateDisplay();
    }

    function appendPostfix(sym) {
      justCalculated = false;
      if (expression === '') expression = '0';
      expression += sym;
      updateDisplay();
    }

    function insertAns() {
      if (justCalculated) {
        expression = '';
        justCalculated = false;
      }
      if (expression === '0') expression = '';
      expression += 'Ans';
      updateDisplay();
    }

    function backspace() {
      if (justCalculated) {
        justCalculated = false;
      }
      const funcs = ['sin(', 'cos(', 'tan(', 'log(', 'ln(', '√(', 'Ans'];
      for (const f of funcs) {
        if (expression.endsWith(f)) {
          expression = expression.slice(0, -f.length);
          updateDisplay();
          return;
        }
      }
      expression = expression.slice(0, -1);
      updateDisplay();
    }

    function clearAll() {
      expression = '';
      prevExprDisplay.textContent = '';
      justCalculated = false;
      updateDisplay();
    }

    // 確定計算（＝）でメモリー履歴に自動記録
    function calculateResult() {
      if (!expression) return;
      try {
        const result = evaluateExpression(expression);
        prevExprDisplay.textContent = `${expression} =`;

        if (typeof result === 'number') {
          lastAnswer = result;
          safeStorageSet(STORAGE_KEYS.LAST_ANSWER, lastAnswer);
          pushMemoryItem(expression, result);
          expression = String(result);
        } else {
          expression = String(result);
        }

        justCalculated = true;
        exprDisplay.textContent = typeof result === 'number' ? formatNumber(result) : result;
        previewDisplay.textContent = '= ' + (typeof result === 'number' ? formatNumber(result) : result);
      } catch (e) {
        previewDisplay.textContent = '数式エラーだべ！💦';
        previewDisplay.className = 'text-right text-sm sm:text-base font-mono font-bold text-rose-400';
      }
    }

    // 手動保存ボタンからメモリー履歴へ追加
    function saveCurrentToMemory() {
      let valToSave = lastAnswer;
      let sourceLabel = '直前の答え (Ans)';

      if (expression) {
        try {
          const evaluated = evaluateExpression(expression);
          if (typeof evaluated === 'number') {
            valToSave = evaluated;
            sourceLabel = expression;
          }
        } catch {
          // 評価できない式の場合は直前の数値を利用
        }
      }

      pushMemoryItem(sourceLabel, valToSave);
    }

    function pushMemoryItem(label, value) {
      memoryHistory.unshift({
        id: Date.now() + Math.random(),
        label,
        value,
        savedAt: new Date().toLocaleString('ja-JP', {
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        })
      });

      if (memoryHistory.length > 50) memoryHistory.pop();
      safeStorageSet(STORAGE_KEYS.MEMORY_HISTORY, memoryHistory);
      renderMemoryHistory();
    }

    function renderMemoryHistory() {
      memoryBadgeCount.textContent = String(memoryHistory.length);

      if (memoryHistory.length === 0) {
        memoryHistoryList.innerHTML = `
          <div class="text-center text-slate-500 text-xs py-12 leading-relaxed">
            メモリー履歴はまだ空だべな〜💾<br>計算するか、上のボタンから値を保存してね！
          </div>
        `;
        return;
      }

      memoryHistoryList.innerHTML = memoryHistory.map((item, idx) => `
        <div class="p-3 rounded-xl bg-slate-950/90 border border-slate-800 hover:border-amber-500/40 transition flex items-center justify-between gap-2">
          <button onclick="useMemoryItem(${idx})" class="text-left flex-grow min-w-0">
            <div class="text-[10px] font-mono text-slate-500 truncate">${item.savedAt || ''} ・ ${escapeHtml(item.label)}</div>
            <div class="text-sm font-mono font-bold text-amber-400 truncate mt-0.5">${formatNumber(item.value)}</div>
          </button>
          <button onclick="deleteMemoryItem(${idx})" class="p-1.5 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition shrink-0" title="この項目を削除">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `).join('');

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function useMemoryItem(idx) {
      const item = memoryHistory[idx];
      if (!item) return;
      if (justCalculated) {
        expression = '';
        justCalculated = false;
      }
      if (expression === '0') expression = '';
      expression += String(item.value);
      updateDisplay();
      closeMemoryDrawer();
    }

    function deleteMemoryItem(idx) {
      memoryHistory.splice(idx, 1);
      safeStorageSet(STORAGE_KEYS.MEMORY_HISTORY, memoryHistory);
      renderMemoryHistory();
    }

    function clearMemoryHistory() {
      memoryHistory = [];
      safeStorageSet(STORAGE_KEYS.MEMORY_HISTORY, memoryHistory);
      renderMemoryHistory();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !memoryDrawer.classList.contains('translate-x-full')) {
        closeMemoryDrawer();
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (/^[0-9]$/.test(e.key)) {
        e.preventDefault();
        appendNumber(e.key);
      } else if (e.key === '.') {
        e.preventDefault();
        appendDot();
      } else if (e.key === '+') {
        e.preventDefault();
        appendOperator('+');
      } else if (e.key === '-') {
        e.preventDefault();
        appendOperator('-');
      } else if (e.key === '*') {
        e.preventDefault();
        appendOperator('×');
      } else if (e.key === '/') {
        e.preventDefault();
        appendOperator('÷');
      } else if (e.key === '^') {
        e.preventDefault();
        appendOperator('^');
      } else if (e.key === '(' || e.key === ')') {
        e.preventDefault();
        appendToken(e.key);
      } else if (e.key === '!') {
        e.preventDefault();
        appendPostfix('!');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculateResult();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        backspace();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        clearAll();
      }
    });
  </script>
</body>
</html>
