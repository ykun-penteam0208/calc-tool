<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多機能計算機 ＆ 方程式ソルバー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    });
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased p-4 sm:p-8">

  <div class="max-w-xl w-full mx-auto flex-grow flex flex-col justify-center relative">
    
    <!-- ヘッダー -->
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <a href="../../index.html" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 hover:border-indigo-500/50 flex items-center justify-center text-slate-400 hover:text-white transition shadow-lg shrink-0">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2 flex-wrap">
            多機能計算機 🧮✨
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">津軽弁</span>
          </h1>
          <p class="text-xs text-slate-400">電卓 ＆ 方程式ソルバー</p>
        </div>
      </div>

      <!-- オプションボタン（通常計算機モードのときだけ表示） -->
      <button id="option-btn" onclick="togglePopover()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-indigo-500/50 text-xs font-bold text-slate-300 hover:text-white transition shadow-lg">
        <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
        <span>変数設定</span>
      </button>
    </header>

    <!-- 変数設定ポップオーバー（初期は非表示） -->
    <div id="popover-panel" class="absolute top-16 right-0 z-50 w-72 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl hidden space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="text-xs font-bold text-indigo-400 flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
          変数メモリ (x, y, a, b, c)
        </span>
        <button onclick="togglePopover()" class="text-slate-400 hover:text-white text-xs">✕ 閉じる</button>
      </div>
      <div class="grid grid-cols-5 gap-2">
        <div>
          <label class="text-[10px] text-slate-400 block mb-0.5 text-center">x</label>
          <input type="number" id="var-x" value="2" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-1 py-1 text-center text-xs font-mono text-white focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-0.5 text-center">y</label>
          <input type="number" id="var-y" value="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-1 py-1 text-center text-xs font-mono text-white focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-0.5 text-center">a</label>
          <input type="number" id="var-a" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-1 py-1 text-center text-xs font-mono text-white focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-0.5 text-center">b</label>
          <input type="number" id="var-b" value="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-1 py-1 text-center text-xs font-mono text-white focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-0.5 text-center">c</label>
          <input type="number" id="var-c" value="5" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-1 py-1 text-center text-xs font-mono text-white focus:border-indigo-500 outline-none">
        </div>
      </div>
      <button onclick="togglePopover()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 rounded-xl text-xs transition">これでOKだべ！</button>
    </div>

    <!-- モード切り替えタブ -->
    <div class="flex bg-slate-900 border border-slate-800 rounded-2xl p-1 mb-4">
      <button onclick="switchMode('calc')" id="tab-calc" class="flex-1 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white transition shadow-sm">通常計算機</button>
      <button onclick="switchMode('eq')" id="tab-eq" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition">方程式ソルバー</button>
    </div>

    <!-- 通常計算機モード -->
    <div id="mode-calc" class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
      
      <!-- ディスプレイ画面（上に入力式、下に大きく計算結果！これがスマートだべ） -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-right space-y-1 shadow-inner">
        <div id="expression" class="text-xs text-slate-400 font-mono min-h-[1.2rem] overflow-x-auto whitespace-nowrap">0</div>
        <div id="display" class="text-3xl sm:text-4xl font-bold font-mono text-white tracking-wider overflow-x-auto whitespace-nowrap">0</div>
      </div>

      <!-- ボタンパッド -->
      <div class="grid grid-cols-5 gap-2">
        <button onclick="clearAll()" class="bg-rose-500/20 border border-rose-500/30 hover:bg-rose-500/30 text-rose-300 font-bold py-3 rounded-xl transition text-sm">AC</button>
        <button onclick="appendValue('sqrt(')" class="bg-indigo-500/20 border border-indigo-500/30 hover:bg-indigo-500/30 text-indigo-300 font-bold py-3 rounded-xl transition text-sm font-mono">√</button>
        <button onclick="appendValue('pi')" class="bg-indigo-500/20 border border-indigo-500/30 hover:bg-indigo-500/30 text-indigo-300 font-bold py-3 rounded-xl transition text-sm font-mono">π</button>
        <button onclick="appendValue('^')" class="bg-indigo-500/20 border border-indigo-500/30 hover:bg-indigo-500/30 text-indigo-300 font-bold py-3 rounded-xl transition text-sm font-mono">x^y</button>
        <button onclick="appendValue('/')" class="bg-slate-800 hover:bg-slate-700 text-indigo-400 font-bold py-3 rounded-xl transition text-lg">÷</button>

        <button onclick="appendValue('x')" class="bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-emerald-400 font-bold py-3 rounded-xl transition font-mono">x</button>
        <button onclick="appendValue('y')" class="bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-emerald-400 font-bold py-3 rounded-xl transition font-mono">y</button>
        <button onclick="appendValue('a')" class="bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-emerald-400 font-bold py-3 rounded-xl transition font-mono">a</button>
        <button onclick="appendValue('b')" class="bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-emerald-400 font-bold py-3 rounded-xl transition font-mono">b</button>
        <button onclick="appendValue('c')" class="bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-emerald-400 font-bold py-3 rounded-xl transition font-mono">c</button>

        <button onclick="appendValue('7')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">7</button>
        <button onclick="appendValue('8')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">8</button>
        <button onclick="appendValue('9')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">9</button>
        <button onclick="appendValue('(')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition text-lg">(</button>
        <button onclick="appendValue('*')" class="bg-slate-800 hover:bg-slate-700 text-indigo-400 font-bold py-3 rounded-xl transition text-lg">×</button>

        <button onclick="appendValue('4')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">4</button>
        <button onclick="appendValue('5')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">5</button>
        <button onclick="appendValue('6')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">6</button>
        <button onclick="appendValue(')')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition text-lg">)</button>
        <button onclick="appendValue('-')" class="bg-slate-800 hover:bg-slate-700 text-indigo-400 font-bold py-3 rounded-xl transition text-lg">-</button>

        <button onclick="appendValue('1')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">1</button>
        <button onclick="appendValue('2')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">2</button>
        <button onclick="appendValue('3')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">3</button>
        <button onclick="appendValue('0')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">0</button>
        <button onclick="appendValue('+')" class="bg-slate-800 hover:bg-slate-700 text-indigo-400 font-bold py-3 rounded-xl transition text-lg">+</button>

        <button onclick="appendValue('.')" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-lg">.</button>
        <button onclick="deleteLast()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-3 rounded-xl transition text-sm flex items-center justify-center"><i data-lucide="delete" class="w-4 h-4"></i></button>
        <button onclick="calculateResult()" class="col-span-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-lg shadow-lg shadow-indigo-600/30">＝ 計算する</button>
      </div>
    </div>

    <!-- 方程式ソルバーモード -->
    <div id="mode-eq" class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-5 hidden">
      
      <!-- 方程式の種類選択 -->
      <div class="grid grid-cols-3 gap-2">
        <button onclick="switchEqType('quadratic')" id="eq-btn-quadratic" class="py-2 px-1 text-xs font-bold rounded-xl bg-indigo-600 text-white transition">二次方程式</button>
        <button onclick="switchEqType('linear2')" id="eq-btn-linear2" class="py-2 px-1 text-xs font-bold rounded-xl bg-slate-800 text-slate-400 hover:text-white transition">連立方程式</button>
        <button onclick="switchEqType('linear1')" id="eq-btn-linear1" class="py-2 px-1 text-xs font-bold rounded-xl bg-slate-800 text-slate-400 hover:text-white transition">一次方程式</button>
      </div>

      <!-- 二次方程式 UI -->
      <div id="eq-form-quadratic" class="space-y-3">
        <div class="text-xs text-indigo-300 font-mono text-center bg-indigo-500/10 border border-indigo-500/20 py-2 rounded-xl">
          $ax^2 + bx + c = 0$ の解を求める
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">係数 a</label>
            <input type="number" id="q-a" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-sm font-mono text-white focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">係数 b</label>
            <input type="number" id="q-b" value="-3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-sm font-mono text-white focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">定数 c</label>
            <input type="number" id="q-c" value="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-sm font-mono text-white focus:border-indigo-500 outline-none">
          </div>
        </div>
        <button onclick="solveQuadratic()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">二次方程式を解く</button>
      </div>

      <!-- 連立方程式 UI -->
      <div id="eq-form-linear2" class="space-y-3 hidden">
        <div class="text-xs text-emerald-300 font-mono text-center bg-emerald-500/10 border border-emerald-500/20 py-2 rounded-xl">
          連立方程式 (2元一次) を解く
        </div>
        <div class="space-y-2">
          <div class="flex items-center gap-2 text-xs font-mono text-slate-300">
            <input type="number" id="l2-a1" value="2" class="w-16 bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-center text-white outline-none"> x + 
            <input type="number" id="l2-b1" value="1" class="w-16 bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-center text-white outline-none"> y = 
            <input type="number" id="l2-c1" value="7" class="w-16 bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-center text-white outline-none">
          </div>
          <div class="flex items-center gap-2 text-xs font-mono text-slate-300">
            <input type="number" id="l2-a2" value="1" class="w-16 bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-center text-white outline-none"> x - 
            <input type="number" id="l2-b2" value="1" class="w-16 bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-center text-white outline-none"> y = 
            <input type="number" id="l2-c2" value="2" class="w-16 bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-center text-white outline-none">
          </div>
        </div>
        <button onclick="solveLinear2()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/30">連立方程式を解く</button>
      </div>

      <!-- 一次方程式 UI -->
      <div id="eq-form-linear1" class="space-y-3 hidden">
        <div class="text-xs text-amber-300 font-mono text-center bg-amber-500/10 border border-amber-500/20 py-2 rounded-xl">
          $ax + b = 0$ の解を求める
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">係数 a</label>
            <input type="number" id="l1-a" value="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-sm font-mono text-white focus:border-amber-500 outline-none">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">定数 b</label>
            <input type="number" id="l1-b" value="-6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center text-sm font-mono text-white focus:border-amber-500 outline-none">
          </div>
        </div>
        <button onclick="solveLinear1()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-amber-600/30">一次方程式を解く</button>
      </div>

      <!-- 方程式の解の出力エリア -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-center space-y-1 shadow-inner">
        <div class="text-[10px] text-slate-400 font-mono">方程式の答え</div>
        <div id="eq-result" class="text-xl sm:text-2xl font-bold font-mono text-emerald-400">数値を入力して計算を押してけろ！</div>
      </div>

    </div>

  </div>

  <footer class="mt-6 text-center text-xs text-slate-500 border-t border-slate-900 pt-3">
    <p>Advanced Calculator & Equations Solver</p>
  </footer>

  <script>
    let currentExpression = "";

    function appendValue(val) {
      currentExpression += val;
      document.getElementById('expression').innerText = currentExpression || "0";
    }

    function clearAll() {
      currentExpression = "";
      document.getElementById('expression').innerText = "0";
      document.getElementById('display').innerText = "0";
    }

    function deleteLast() {
      currentExpression = currentExpression.slice(0, -1);
      document.getElementById('expression').innerText = currentExpression || "0";
    }

    function calculateResult() {
      if (!currentExpression) return;
      try {
        const scope = {
          x: parseFloat(document.getElementById('var-x').value) || 0,
          y: parseFloat(document.getElementById('var-y').value) || 0,
          a: parseFloat(document.getElementById('var-a').value) || 0,
          b: parseFloat(document.getElementById('var-b').value) || 0,
          c: parseFloat(document.getElementById('var-c').value) || 0,
          pi: Math.PI
        };

        let result = math.evaluate(currentExpression, scope);
        if (typeof result === 'number' && !Number.isInteger(result)) {
          result = Math.round(result * 100000000) / 100000000;
        }
        document.getElementById('display').innerText = result;
      } catch (error) {
        document.getElementById('display').innerText = "エラーだば！";
      }
    }

    // オプションポップオーバーの開閉
    function togglePopover() {
      const panel = document.getElementById('popover-panel');
      panel.classList.toggle('hidden');
    }

    // タブ切り替え
    function switchMode(mode) {
      const calcTab = document.getElementById('tab-calc');
      const eqTab = document.getElementById('tab-eq');
      const calcMode = document.getElementById('mode-calc');
      const eqMode = document.getElementById('mode-eq');
      const optionBtn = document.getElementById('option-btn');

      if (mode === 'calc') {
        calcTab.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white transition shadow-sm";
        eqTab.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition";
        calcMode.classList.remove('hidden');
        eqMode.classList.add('hidden');
        optionBtn.classList.remove('hidden'); // 通常計算機の時だけ変数設定ボタンを表示
      } else {
        eqTab.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white transition shadow-sm";
        calcTab.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition";
        eqMode.classList.remove('hidden');
        calcMode.classList.add('hidden');
        optionBtn.classList.add('hidden'); // 方程式の時は非表示
        document.getElementById('popover-panel').classList.add('hidden'); // 閉じておく
      }
    }

    // 方程式の種類切り替え
    function switchEqType(type) {
      document.getElementById('eq-btn-quadratic').className = type === 'quadratic' ? "py-2 px-1 text-xs font-bold rounded-xl bg-indigo-600 text-white transition" : "py-2 px-1 text-xs font-bold rounded-xl bg-slate-800 text-slate-400 hover:text-white transition";
      document.getElementById('eq-btn-linear2').className = type === 'linear2' ? "py-2 px-1 text-xs font-bold rounded-xl bg-indigo-600 text-white transition" : "py-2 px-1 text-xs font-bold rounded-xl bg-slate-800 text-slate-400 hover:text-white transition";
      document.getElementById('eq-btn-linear1').className = type === 'linear1' ? "py-2 px-1 text-xs font-bold rounded-xl bg-indigo-600 text-white transition" : "py-2 px-1 text-xs font-bold rounded-xl bg-slate-800 text-slate-400 hover:text-white transition";

      document.getElementById('eq-form-quadratic').classList.toggle('hidden', type !== 'quadratic');
      document.getElementById('eq-form-linear2').classList.toggle('hidden', type !== 'linear2');
      document.getElementById('eq-form-linear1').classList.toggle('hidden', type !== 'linear1');
      document.getElementById('eq-result').innerText = "数値を入力して計算を押してけろ！";
    }

    // 二次方程式ソルバー
    function solveQuadratic() {
      const a = parseFloat(document.getElementById('q-a').value) || 0;
      const b = parseFloat(document.getElementById('q-b').value) || 0;
      const c = parseFloat(document.getElementById('q-c').value) || 0;

      if (a === 0) {
        document.getElementById('eq-result').innerText = "aが0だから二次方程式じゃねぇど！";
        return;
      }

      const d = b * b - 4 * a * c;
      if (d > 0) {
        const x1 = (-b + Math.sqrt(d)) / (2 * a);
        const x2 = (-b - Math.sqrt(d)) / (2 * a);
        document.getElementById('eq-result').innerHTML = `x = ${round(x1)}, ${round(x2)} <span class="text-xs text-slate-400 block mt-1">(異なる2つの実数解)</span>`;
      } else if (d === 0) {
        const x = -b / (2 * a);
        document.getElementById('eq-result').innerHTML = `x = ${round(x)} <span class="text-xs text-slate-400 block mt-1">(重解)</span>`;
      } else {
        const real = round(-b / (2 * a));
        const img = round(Math.sqrt(-d) / (2 * a));
        document.getElementById('eq-result').innerHTML = `x = ${real} ± ${img}i <span class="text-xs text-slate-400 block mt-1">(虚数解)</span>`;
      }
    }

    // 連立方程式ソルバー
    function solveLinear2() {
      const a1 = parseFloat(document.getElementById('l2-a1').value) || 0;
      const b1 = parseFloat(document.getElementById('l2-b1').value) || 0;
      const c1 = parseFloat(document.getElementById('l2-c1').value) || 0;
      const a2 = parseFloat(document.getElementById('l2-a2').value) || 0;
      const b2 = parseFloat(document.getElementById('l2-b2').value) || 0;
      const c2 = parseFloat(document.getElementById('l2-c2').value) || 0;

      const det = a1 * b2 - a2 * b1;
      if (det === 0) {
        document.getElementById('eq-result').innerText = "解がないか、無数に存在するだば！";
        return;
      }

      const x = (c1 * b2 - c2 * b1) / det;
      const y = (a1 * c2 - a2 * c1) / det;
      document.getElementById('eq-result').innerHTML = `x = ${round(x)}, y = ${round(y)}`;
    }

    // 一次方程式ソルバー
    function solveLinear1() {
      const a = parseFloat(document.getElementById('l1-a').value) || 0;
      const b = parseFloat(document.getElementById('l1-b').value) || 0;

      if (a === 0) {
        document.getElementById('eq-result').innerText = b === 0 ? "解は無数にあるだば！" : "解なしだば！";
        return;
      }

      const x = -b / a;
      document.getElementById('eq-result'].innerHTML = `x = ${round(x)}`;
    }

    function round(val) {
      return Math.round(val * 100000000) / 100000000;
    }
  </script>

</body>
</html>
