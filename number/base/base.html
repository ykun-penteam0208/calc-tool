<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進数変換シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
    window.baseApp = function() {
      return {
        inputVal: '42',
        fromBase: 10,
        toBase: 2,
        
        get convertedResult() {
          const trimmed = String(this.inputVal).trim();
          const fBase = Number(this.fromBase);
          const tBase = Number(this.toBase);

          if (!trimmed) return '数値を入力してけろ';
          
          if (!Number.isFinite(fBase) || fBase < 2 || fBase > 36 || !Number.isFinite(tBase) || tBase < 2 || tBase > 36) {
            return 'エラー: 進数は 2 から 36 の間で選んでけろ！';
          }

          try {
            const decimalVal = parseInt(trimmed, fBase);
            if (isNaN(decimalVal)) {
              return 'エラー: その進数には存在しない文字が入ってるよ';
            }
            return decimalVal.toString(tBase).toUpperCase();
          } catch (e) {
            return '変換エラー';
          }
        },
        init() {
          this.$nextTick(() => { window.lucide && window.lucide.createIcons(); });
        }
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-8 antialiased">
  <div x-data="baseApp()" class="max-w-xl w-full mx-auto my-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
    
    <div class="flex items-center justify-between mb-6">
      <!-- ルートに戻るため ../../index.html に修正！ -->
      <a href="../../index.html" class="text-xs text-indigo-400 hover:underline flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> ポータルに戻る
      </a>
      <span class="text-xs font-mono bg-indigo-500/15 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-500/30">自由進数コンバーター</span>
    </div>

    <h1 class="text-2xl font-bold text-white mb-2">🔢 進数変換シミュレーター</h1>
    <p class="text-xs text-slate-400 mb-6">元の進数も、変換先の進数も、好きな数字（2〜36）を自由に選べるぞい！</p>

    <!-- 入力値 -->
    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-400 mb-1.5">変換したい数値</label>
      <input type="text" x-model="inputVal" class="w-full bg-slate-950 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 font-mono text-lg text-white outline-none" placeholder="例: 42">
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <!-- 変換元 -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">元の進数 (●)</label>
        <input 
          type="number" 
          min="2" 
          max="36" 
          x-model.number="fromBase" 
          class="w-full bg-slate-950 border border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-3 font-mono text-sm text-white outline-none"
        >
        <span class="text-[10px] text-slate-500 mt-1 block">2 〜 36 の間で入力</span>
      </div>

      <!-- 変換先 -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">変換先の進数 (〇)</label>
        <input 
          type="number" 
          min="2" 
          max="36" 
          x-model.number="toBase" 
          class="w-full bg-slate-950 border border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-3 font-mono text-sm text-white outline-none"
        >
        <span class="text-[10px] text-slate-500 mt-1 block">2 〜 36 の間で入力</span>
      </div>
    </div>

    <!-- 結果表示 -->
    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-center">
      <div class="text-xs text-slate-400 mb-1">変換結果</div>
      <div class="font-mono text-2xl font-bold text-emerald-400 break-all" x-text="convertedResult"></div>
    </div>

  </div>
</body>
</html>
