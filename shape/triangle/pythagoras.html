<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三平方の定理 直感シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };

    window.pythagorasApp = function() {
      return {
        sideA: 3,
        sideB: 4,
        displayMode: 'clean', // 'clean' (2√2形式), 'decimal' (小数), 'radical' (√形式)

        // ルートの中身を簡単化して a√b の形にする関数
        simplifyRoot(n) {
          if (n <= 0) return { coeff: 0, rad: 0, text: '0' };
          if (Number.isInteger(Math.sqrt(n))) {
            return { coeff: Math.sqrt(n), rad: 1, text: Math.sqrt(n).toString() };
          }
          let coeff = 1;
          let rad = n;
          for (let i = 2; i * i <= rad; i++) {
            while (rad % (i * i) === 0) {
              coeff *= i;
              rad /= (i * i);
            }
          }
          if (rad === 1) return { coeff: coeff, rad: 1, text: coeff.toString() };
          if (coeff === 1) return { coeff: 1, rad: rad, text: `√${rad}` };
          return { coeff: coeff, rad: rad, text: `${coeff}√${rad}` };
        },

        // 計算結果のオブジェクトを返す
        get result() {
          const a = Number(this.sideA);
          const b = Number(this.sideB);

          if (!Number.isFinite(a) || !Number.isFinite(b) || a <= 0 || b <= 0) {
            return { valid: false, message: '0より大きい数字を入力してけろ！' };
          }

          const sumSq = (a * a) + (b * b);
          const exactDecimal = Math.sqrt(sumSq);
          const rootInfo = this.simplifyRoot(sumSq);

          let formattedText = '';
          if (this.displayMode === 'clean') {
            formattedText = rootInfo.text;
          } else if (this.displayMode === 'decimal') {
            formattedText = Number.isInteger(exactDecimal) ? exactDecimal.toString() : exactDecimal.toFixed(5);
          } else if (this.displayMode === 'radical') {
            formattedText = `√${sumSq}`;
          }

          return {
            valid: true,
            sumSq: sumSq,
            decimal: exactDecimal,
            cleanText: rootInfo.text,
            formatted: formattedText,
            formula: `${a}² + ${b}² = ${a*a} + ${b*b} = ${sumSq}`
          };
        },

        init() {
          this.$nextTick(() => { window.lucide && window.lucide.createIcons(); });
        }
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-8 antialiased">
  <div x-data="pythagorasApp()" class="max-w-2xl w-full mx-auto my-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <!-- ヘッダー -->
    <div class="flex items-center justify-between mb-6">
      <a href="../../index.html" class="text-xs text-indigo-400 hover:underline flex items-center gap-1 font-semibold">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> ポータルに戻る
      </a>
      <span class="text-xs font-mono bg-indigo-500/15 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30 font-bold">直角三角形 &amp; 三平方の定理</span>
    </div>

    <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2 flex items-center gap-2">
      <span>📐</span> 三平方の定理ビジュアライザー
    </h1>
    <p class="text-xs sm:text-sm text-slate-400 mb-6">
      直角を挟む2つの辺（<span class="text-cyan-400 font-mono font-bold">a</span> と <span class="text-indigo-400 font-mono font-bold">b</span>）をいじると、斜辺 <span class="text-emerald-400 font-mono font-bold">c</span> がどうなるか直感でわかるぞい！
    </p>

    <!-- 入力セクション -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
        <label class="block text-xs font-semibold text-cyan-400 mb-1.5 flex items-center justify-between">
          <span>底辺 (a)</span>
          <span class="font-mono text-white" x-text="sideA"></span>
        </label>
        <input type="number" step="any" min="0.1" x-model.number="sideA" class="w-full bg-slate-900 border border-slate-700 focus:border-cyan-500 rounded-xl px-3.5 py-2.5 font-mono text-base text-white outline-none">
      </div>

      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
        <label class="block text-xs font-semibold text-indigo-400 mb-1.5 flex items-center justify-between">
          <span>高さ (b)</span>
          <span class="font-mono text-white" x-text="sideB"></span>
        </label>
        <input type="number" step="any" min="0.1" x-model.number="sideB" class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 font-mono text-base text-white outline-none">
      </div>
    </div>

    <!-- 表示形式の切り替えボタン -->
    <div class="mb-6 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 flex flex-wrap gap-1">
      <button 
        @click="displayMode = 'clean'" 
        :class="displayMode === 'clean' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'"
        class="flex-1 min-w-[100px] py-2 px-3 rounded-xl text-xs font-bold transition cursor-pointer"
      >
        ✨ きれいな根号 (<span class="font-mono">2√2</span>)
      </button>
      <button 
        @click="displayMode = 'radical'" 
        :class="displayMode === 'radical' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'"
        class="flex-1 min-w-[100px] py-2 px-3 rounded-xl text-xs font-bold transition cursor-pointer"
      >
        🌲 ルートでまとめる (<span class="font-mono">√8</span>)
      </button>
      <button 
        @click="displayMode = 'decimal'" 
        :class="displayMode === 'decimal' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'"
        class="flex-1 min-w-[100px] py-2 px-3 rounded-xl text-xs font-bold transition cursor-pointer"
      >
        🔢 小数で出す (<span class="font-mono">2.828...</span>)
      </button>
    </div>

    <!-- 結果カード -->
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 mb-6 text-center relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-400 via-indigo-400 to-emerald-400"></div>
      
      <template x-if="result.valid">
        <div>
          <div class="text-xs text-slate-400 mb-1">斜辺の長さ (<span class="text-emerald-400 font-mono font-bold">c = √(a² + b²)</span>)</div>
          <div class="font-mono text-3xl sm:text-4xl font-extrabold text-emerald-400 mb-3 tracking-tight" x-text="result.formatted"></div>
          
          <div class="inline-block bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 font-mono text-xs text-slate-300">
            計算式: <span class="text-indigo-300" x-text="result.formula"></span>
          </div>
        </div>
      </template>

      <template x-if="!result.valid">
        <div class="text-amber-300 text-sm py-2" x-text="result.message"></div>
      </template>
    </div>

    <!-- 直感ビジュアルプレビュー（SVG） -->
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-center min-h-[180px]">
      <svg class="w-full max-w-[260px] h-[160px] overflow-visible" viewBox="0 0 200 140">
        <!-- 直角三角形のパス -->
        <polygon points="20,120 170,120 20,20" fill="rgba(99, 102, 241, 0.1)" stroke="#818cf8" stroke-width="3" stroke-linejoin="round"/>
        <!-- 直角マーク -->
        <rect x="20" y="104" width="16" height="16" fill="none" stroke="#94a3b8" stroke-width="2"/>
        <!-- 辺aのラベル (底辺) -->
        <text x="95" y="138" fill="#22d3ee" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold" x-text="'a = ' + sideA"></text>
        <!-- 辺bのラベル (高さ) -->
        <text x="5" y="75" fill="#818cf8" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold" transform="rotate(-90, 5, 75)" x-text="'b = ' + sideB"></text>
        <!-- 斜辺cのラベル -->
        <text x="105" y="65" fill="#34d399" font-size="12" font-family="monospace" font-weight="bold" x-text="'c'"></text>
      </svg>
    </div>

  </div>
</body>
</html>
