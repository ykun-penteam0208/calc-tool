<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三平方の定理 直感シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } }
    };

    window.pythagorasApp = function() {
      return {
        sideA: 3,
        sideB: 4,
        displayMode: 'clean',
        animatedA: 3,
        animatedB: 4,
        animationFrame: null,

        init() {
          this.$watch('sideA', () => this.animateTriangle());
          this.$watch('sideB', () => this.animateTriangle());
          this.$nextTick(() => window.lucide && window.lucide.createIcons());
        },

        // Keep the side ratio while fitting the triangle inside the SVG viewBox.
        get triangleGeometry() {
          const a = Number(this.animatedA);
          const b = Number(this.animatedB);
          if (!Number.isFinite(a) || !Number.isFinite(b) || a <= 0 || b <= 0) {
            return { x: 25, y: 115, width: 110, height: 82.5 };
          }
          const scale = Math.min(150 / a, 90 / b);
          return { x: 25, y: 115, width: a * scale, height: b * scale };
        },

        get trianglePoints() {
          const g = this.triangleGeometry;
          return `${g.x},${g.y} ${g.x + g.width},${g.y} ${g.x},${g.y - g.height}`;
        },

        animateTriangle() {
          const targetA = Number(this.sideA);
          const targetB = Number(this.sideB);
          if (!Number.isFinite(targetA) || !Number.isFinite(targetB) || targetA <= 0 || targetB <= 0) return;

          if (this.animationFrame !== null) cancelAnimationFrame(this.animationFrame);
          const startA = Number(this.animatedA);
          const startB = Number(this.animatedB);
          const startTime = performance.now();
          const duration = 420;
          const step = (now) => {
            const progress = Math.min((now - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            this.animatedA = startA + (targetA - startA) * eased;
            this.animatedB = startB + (targetB - startB) * eased;
            if (progress < 1) {
              this.animationFrame = requestAnimationFrame(step);
            } else {
              this.animatedA = targetA;
              this.animatedB = targetB;
              this.animationFrame = null;
            }
          };
          this.animationFrame = requestAnimationFrame(step);
        },

        simplifyRoot(n) {
          if (n <= 0) return { text: '0' };
          if (!Number.isInteger(n)) return { text: `√${n}` };
          if (Number.isInteger(Math.sqrt(n))) return { text: Math.sqrt(n).toString() };
          let coeff = 1;
          let rad = n;
          for (let i = 2; i * i <= rad; i++) {
            while (rad % (i * i) === 0) {
              coeff *= i;
              rad /= (i * i);
            }
          }
          if (rad === 1) return { text: coeff.toString() };
          if (coeff === 1) return { text: `√${rad}` };
          return { text: `${coeff}√${rad}` };
        },

        get result() {
          const a = Number(this.sideA);
          const b = Number(this.sideB);
          if (!Number.isFinite(a) || !Number.isFinite(b) || a <= 0 || b <= 0) {
            return { valid: false, message: '0より大きい数字を入力してください。' };
          }
          const sumSq = a * a + b * b;
          const decimal = Math.sqrt(sumSq);
          const rootInfo = this.simplifyRoot(sumSq);
          let formatted;
          if (this.displayMode === 'clean') formatted = rootInfo.text;
          else if (this.displayMode === 'decimal') formatted = Number.isInteger(decimal) ? decimal.toString() : decimal.toFixed(5);
          else formatted = `√${sumSq}`;
          return {
            valid: true,
            formatted,
            formula: `${a}² + ${b}² = ${a * a} + ${b * b} = ${sumSq}`
          };
        }
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-8 antialiased">
  <main x-data="pythagorasApp()" class="max-w-2xl w-full mx-auto my-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    <div class="flex items-center justify-between mb-6">
      <a href="../../index.html" class="text-xs text-indigo-400 hover:underline flex items-center gap-1 font-semibold">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> ポータルに戻る
      </a>
      <span class="text-xs font-mono bg-indigo-500/15 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30 font-bold">直角三角形 &amp; 三平方の定理</span>
    </div>

    <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2 flex items-center gap-2"><span>📐</span> 三平方の定理ビジュアライザー</h1>
    <p class="text-xs sm:text-sm text-slate-400 mb-6">直角を挟む2辺の長さを変えると、三角形がなめらかに伸び縮みします。</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
        <label class="block text-xs font-semibold text-cyan-400 mb-1.5 flex items-center justify-between">
          <span>底辺 (a)</span><span class="font-mono text-white" x-text="sideA"></span>
        </label>
        <input type="number" step="any" min="0.1" x-model.number="sideA" class="w-full bg-slate-900 border border-slate-700 focus:border-cyan-500 rounded-xl px-3.5 py-2.5 font-mono text-base text-white outline-none">
      </div>
      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
        <label class="block text-xs font-semibold text-indigo-400 mb-1.5 flex items-center justify-between">
          <span>高さ (b)</span><span class="font-mono text-white" x-text="sideB"></span>
        </label>
        <input type="number" step="any" min="0.1" x-model.number="sideB" class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 font-mono text-base text-white outline-none">
      </div>
    </div>

    <div class="mb-6 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 flex flex-wrap gap-1">
      <button @click="displayMode = 'clean'" :class="displayMode === 'clean' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'" class="flex-1 min-w-[100px] py-2 px-3 rounded-xl text-xs font-bold transition cursor-pointer">✨ きれいな根号</button>
      <button @click="displayMode = 'radical'" :class="displayMode === 'radical' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'" class="flex-1 min-w-[100px] py-2 px-3 rounded-xl text-xs font-bold transition cursor-pointer">🌲 ルートで表示</button>
      <button @click="displayMode = 'decimal'" :class="displayMode === 'decimal' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'" class="flex-1 min-w-[100px] py-2 px-3 rounded-xl text-xs font-bold transition cursor-pointer">🔢 小数で表示</button>
    </div>

    <section class="bg-slate-950 border border-slate-800 rounded-2xl p-5 mb-6 text-center relative overflow-hidden" aria-live="polite">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-400 via-indigo-400 to-emerald-400"></div>
      <template x-if="result.valid">
        <div>
          <div class="text-xs text-slate-400 mb-1">斜辺の長さ (<span class="text-emerald-400 font-mono font-bold">c = √(a² + b²)</span>)</div>
          <div class="font-mono text-3xl sm:text-4xl font-extrabold text-emerald-400 mb-3 tracking-tight" x-text="result.formatted"></div>
          <div class="inline-block bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 font-mono text-xs text-slate-300">計算式: <span class="text-indigo-300" x-text="result.formula"></span></div>
        </div>
      </template>
      <template x-if="!result.valid"><div class="text-amber-300 text-sm py-2" x-text="result.message"></div></template>
    </section>

    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-center min-h-[220px]">
      <svg class="w-full max-w-[320px] h-[200px] overflow-visible" viewBox="0 0 200 140" role="img" aria-label="入力した辺の比に合わせて伸び縮みする直角三角形">
        <polygon :points="trianglePoints" fill="rgba(99, 102, 241, 0.1)" stroke="#818cf8" stroke-width="3" stroke-linejoin="round" style="transition: fill 200ms ease" />
        <rect x="25" y="99" width="16" height="16" fill="none" stroke="#94a3b8" stroke-width="2" />
        <text :x="triangleGeometry.x + triangleGeometry.width / 2" y="134" fill="#22d3ee" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold" x-text="'a = ' + Number(animatedA).toFixed(2).replace(/\\.?0+$/, '')"></text>
        <text x="11" :y="triangleGeometry.y - triangleGeometry.height / 2" fill="#818cf8" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold" :transform="'rotate(-90, 11, ' + (triangleGeometry.y - triangleGeometry.height / 2) + ')'" x-text="'b = ' + Number(animatedB).toFixed(2).replace(/\\.?0+$/, '')"></text>
        <text :x="triangleGeometry.x + triangleGeometry.width / 2 + 5" :y="triangleGeometry.y - triangleGeometry.height / 2 - 3" fill="#34d399" font-size="12" font-family="monospace" font-weight="bold">c</text>
      </svg>
    </div>
    <p class="text-center text-[11px] text-slate-500 mt-3">���の比率を保ちながら、図の枠内に収まるように表示します。</p>
  </main>
</body>
</html>
